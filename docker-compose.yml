version: '3.8'

services:
  deploymind:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deploymind-monolith
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - PROXY_PROVIDER=caddy
      - CADDY_API_URL=http://caddy:2019
      - BASE_DOMAIN=localhost
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - deploymind_data:/var/lib/deploymind
    networks:
      - deploymind-net

  caddy:
    image: caddy:2-alpine
    container_name: deploymind-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./ingress/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - deploymind-net

networks:
  deploymind-net:
    name: deploymind-net
    driver: bridge

volumes:
  deploymind_data:
  caddy_data:
  caddy_config:
